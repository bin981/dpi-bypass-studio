[project]
name = "dpi-bypass-studio"
version = "1.0.0"
description = "Windows için DPI bypass ve şifreli DNS masaüstü uygulaması"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
